name: PestFlow prewritten blog audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "automation/pestflow-software-keywords.json"
      - "scripts/build-prewritten-pestflow-backlog.mjs"
      - "client/src/content/generated-blog-posts.json"
      - "client/src/content/scheduled-blog-posts.json"
      - "client/src/content/scheduled-blog-posts-phase-two.json"
      - ".github/workflows/daily-pestflow-blog.yml"

permissions:
  contents: read

jobs:
  verify:
    name: Verify prewritten owner-software backlog
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Rebuild committed backlog
        run: npm run blog:build-backlog

      - name: Confirm backlog is committed
        run: git diff --exit-code -- client/src/content/scheduled-blog-posts-phase-two.json

      - name: Type check
        run: npm run check

      - name: Build
        run: npm run build
